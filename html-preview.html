<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>HTML Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237d8cff'/%3E%3Cpath d='M22 24l-8 8 8 8M42 24l8 8-8 8M36 18L28 46' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* Mid-grey dark theme: the ground sits around #43464c — clearly dark, but
     nowhere near black, with the card lifted a step above it. */
  :root{
    --bg:#43464c;
    --card:#4d5158;
    --sunken:#3b3e44;
    --line:#5b606a;
    --line-2:#6a707b;
    --text:#eceef2;
    --muted:#b4b9c3;
    --faint:#8f959f;
    --accent:#7d8cff;
    --accent-ink:#12142a;
    --danger:#ff8a95;
    --shadow:0 1px 2px rgba(0,0,0,.18),0 14px 32px -18px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --bg:#e9ecf1;
    --card:#fdfdfe;
    --sunken:#f4f6f9;
    --line:#d6dae2;
    --line-2:#c2c8d4;
    --text:#1f2430;
    --muted:#646c7d;
    --faint:#8a91a1;
    --accent:#4f6bed;
    --accent-ink:#ffffff;
    --danger:#d1495b;
    --shadow:0 1px 2px rgba(22,28,45,.05),0 12px 28px -18px rgba(22,28,45,.35);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:24px;
    transition:background .25s ease,color .25s ease;
  }
  button,input,textarea{font:inherit;color:inherit}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

  .card{
    width:min(100%,720px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:22px;
    transition:background .25s ease,border-color .25s ease;
  }
  .head{display:flex;align-items:center;gap:10px}
  .head svg.logo{width:26px;height:26px;flex:none}
  h1{margin:0;font-size:1.12rem;font-weight:650;letter-spacing:-.01em;flex:1}
  .sub{margin:4px 0 18px;color:var(--muted);font-size:.88rem}

  .icon-btn{
    display:grid;place-items:center;width:32px;height:32px;flex:none;
    border-radius:9px;border:1px solid var(--line);background:var(--sunken);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .icon-btn:hover{border-color:var(--line-2)}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  :root[data-theme="dark"] .moon{display:none}
  :root[data-theme="light"] .sun{display:none}

  /* ── the sliding switch ──────────────────────────────────────────── */
  .seg{
    position:relative;
    display:grid;grid-template-columns:1fr 1fr;
    padding:4px;border-radius:11px;
    background:var(--sunken);border:1px solid var(--line);
    margin-bottom:16px;
  }
  .seg-pill{
    position:absolute;top:4px;left:4px;
    width:calc(50% - 4px);height:calc(100% - 8px);
    border-radius:8px;background:var(--accent);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .seg[data-mode="code"] .seg-pill{transform:translateX(100%)}
  .seg button{
    position:relative;z-index:1;
    border:0;background:transparent;cursor:pointer;
    padding:9px 10px;border-radius:8px;
    font-size:.88rem;font-weight:600;color:var(--muted);
    transition:color .25s ease;
  }
  .seg button[aria-selected="true"]{color:var(--accent-ink)}

  /* ── crossfading panels ──────────────────────────────────────────── */
  .panels{position:relative;transition:height .3s cubic-bezier(.4,0,.2,1);overflow:hidden}
  .panel{
    position:absolute;top:0;left:0;right:0;
    opacity:0;visibility:hidden;
    transform:translateY(4px);
    transition:opacity .24s ease,transform .24s ease,visibility .24s;
  }
  .panel.on{opacity:1;visibility:visible;transform:none}

  .drop{
    border:1.5px dashed var(--line-2);border-radius:11px;background:var(--sunken);
    padding:26px 20px;text-align:center;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent)}
  .drop .big{font-weight:600;font-size:.95rem}
  .drop .small{color:var(--faint);font-size:.82rem;margin-top:3px}
  .drop .name{color:var(--accent);font-weight:600;font-size:.86rem;margin-top:8px;word-break:break-all}

  textarea{
    width:100%;min-height:196px;resize:vertical;display:block;
    padding:12px 13px;border:1px solid var(--line-2);border-radius:10px;
    background:var(--sunken);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.83rem;line-height:1.55;tab-size:2;
  }
  textarea::placeholder{color:var(--faint)}
  textarea:focus-visible,.drop:focus-visible,.seg button:focus-visible,.icon-btn:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  .row{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line-2);background:var(--sunken);
    font-size:.88rem;font-weight:600;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.07)}
  .spacer{flex:1}
  .check{display:inline-flex;align-items:center;gap:7px;font-size:.83rem;color:var(--muted);cursor:pointer;user-select:none}
  .check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .err{color:var(--danger);font-size:.83rem;margin-top:10px;min-height:1em}

  /* ── preview overlay ─────────────────────────────────────────────── */
  .stage{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
  .stage[hidden]{display:none}
  .bar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
  .bar .title{font-size:.82rem;color:var(--muted);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .btn{padding:6px 12px;font-size:.82rem}
  /* white regardless of theme: a page with no background of its own really
     is white, and the preview should show it as it is */
  .stage iframe{flex:1;width:100%;border:0;background:#fff}
  .stage:fullscreen .bar,.stage:-webkit-full-screen .bar{display:none}

  .hint{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(16,18,24,.9);color:#fff;font-size:.78rem;padding:6px 12px;border-radius:999px;
    pointer-events:none;opacity:0;transition:opacity .25s;z-index:101;
  }
  .hint.show{opacity:1}
</style>
</head>
<body>

<main class="card">
  <div class="head">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#7d8cff"/>
      <path d="M22 24l-8 8 8 8M42 24l8 8-8 8M36 18L28 46" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>HTML Preview</h1>
    <button class="icon-btn" id="theme" aria-label="Switch theme" title="Switch theme">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
  <p class="sub">Pick a file or paste some HTML. It opens full screen straight away.</p>

  <div class="seg" id="seg" data-mode="file" role="tablist" aria-label="Input method">
    <span class="seg-pill" aria-hidden="true"></span>
    <button role="tab" id="tabFile" data-mode="file" aria-selected="true" aria-controls="panelFile">Choose a file</button>
    <button role="tab" id="tabCode" data-mode="code" aria-selected="false" aria-controls="panelCode">Paste code</button>
  </div>

  <div class="panels" id="panels">
    <div class="panel on" id="panelFile" role="tabpanel" aria-labelledby="tabFile">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an HTML file, or drop one here">
        <div class="big">Click to choose a file</div>
        <div class="small">or drag one here &middot; .html, .htm, .svg, .txt</div>
        <div class="name" id="fileName"></div>
      </div>
    </div>
    <div class="panel" id="panelCode" role="tabpanel" aria-labelledby="tabCode">
      <textarea id="code" spellcheck="false" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;  &lt;body&gt;&#10;    &lt;h1&gt;Hello&lt;/h1&gt;&#10;  &lt;/body&gt;&#10;&lt;/html&gt;"></textarea>
    </div>
  </div>
  <input type="file" id="file" accept=".html,.htm,.svg,.txt,text/html,image/svg+xml" hidden>

  <div class="row">
    <button class="btn primary" id="run">Open full screen</button>
    <button class="btn" id="clear">Clear</button>
    <span class="spacer"></span>
    <label class="check" title="Runs the page in an isolated origin. Turn off if it needs localStorage or cookies.">
      <input type="checkbox" id="isolate" checked>
      Isolate
    </label>
  </div>
  <div class="err" id="err"></div>
</main>

<section class="stage" id="stage" hidden>
  <div class="bar">
    <button class="btn" id="back">&larr; Back</button>
    <button class="btn" id="reload">Reload</button>
    <button class="btn" id="full">Fullscreen</button>
    <span class="title" id="stageTitle"></span>
  </div>
  <iframe id="frame" title="Preview"></iframe>
</section>

<div class="hint" id="hint">Press Esc to go back</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const seg = $("seg"), panels = $("panels");
  const panelFile = $("panelFile"), panelCode = $("panelCode");
  const drop = $("drop"), file = $("file"), code = $("code"), err = $("err");
  const stage = $("stage"), hint = $("hint");

  let current = "", label = "";
  const setErr = (m) => { err.textContent = m || ""; };

  /* ── theme ───────────────────────────────────────────────────────── */
  try {
    const saved = localStorage.getItem("htmlpreview:theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch {}
  $("theme").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("htmlpreview:theme", next); } catch {}
  });

  /* ── the switch ──────────────────────────────────────────────────────
     Panels are stacked absolutely so they can crossfade. That takes them
     out of flow, so the wrapper carries an explicit height, animated to
     match whichever panel is showing. */
  function sizePanels() {
    const active = seg.dataset.mode === "code" ? panelCode : panelFile;
    panels.style.height = active.offsetHeight + "px";
  }

  function setMode(mode, focus) {
    seg.dataset.mode = mode;
    const isCode = mode === "code";
    $("tabFile").setAttribute("aria-selected", String(!isCode));
    $("tabCode").setAttribute("aria-selected", String(isCode));
    panelFile.classList.toggle("on", !isCode);
    panelCode.classList.toggle("on", isCode);
    sizePanels();
    if (focus) (isCode ? code : drop).focus();
  }

  seg.addEventListener("click", (e) => {
    const b = e.target.closest("[data-mode]");
    if (b && b.dataset.mode !== seg.dataset.mode) setMode(b.dataset.mode, true);
  });
  seg.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    setMode(seg.dataset.mode === "code" ? "file" : "code", true);
  });

  // the textarea is user-resizable, so keep the wrapper in step
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(sizePanels);
    ro.observe(panelFile); ro.observe(panelCode);
  }
  addEventListener("resize", sizePanels);

  /* ── preview ─────────────────────────────────────────────────────── */
  function flashHint() {
    hint.classList.add("show");
    setTimeout(() => hint.classList.remove("show"), 1800);
  }

  /* Rebuild the iframe each run: swapping the sandbox attribute on a live
     frame doesn't reliably re-apply it, and a fresh element also stops
     state leaking between previews. */
  function show(html, name) {
    if (!html.trim()) { setErr("Nothing to preview yet."); return; }
    setErr("");
    current = html;
    label = name || "pasted code";
    $("stageTitle").textContent = label;

    const frame = document.createElement("iframe");
    frame.id = "frame";
    frame.title = "Preview";
    if ($("isolate").checked) {
      // No allow-same-origin alongside allow-scripts: that pairing would let
      // the frame remove its own sandbox.
      frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock");
    }
    $("frame").replaceWith(frame);
    frame.srcdoc = html;
    stage.hidden = false;
    flashHint();
  }

  function close() {
    if (document.fullscreenElement) document.exitFullscreen?.();
    stage.hidden = true;
    $("frame").removeAttribute("srcdoc");
  }

  /* ── file input ──────────────────────────────────────────────────── */
  function readFile(f) {
    if (!f) return;
    if (f.size > 25 * 1024 * 1024) { setErr("That file is over 25 MB — too big to preview."); return; }
    const r = new FileReader();
    r.onload = () => {
      setMode("file");
      $("fileName").textContent = f.name;
      code.value = r.result;
      show(r.result, f.name);
    };
    r.onerror = () => setErr("Couldn't read that file.");
    r.readAsText(f);
  }

  drop.addEventListener("click", () => file.click());
  drop.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); }
  });
  file.addEventListener("change", () => readFile(file.files[0]));

  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, () => drop.classList.remove("over")));
  drop.addEventListener("drop", (e) => { e.preventDefault(); readFile(e.dataTransfer?.files?.[0]); });
  // a stray drop elsewhere would otherwise navigate the tab away
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("drop", e => e.preventDefault());

  /* ── paste ───────────────────────────────────────────────────────── */
  code.addEventListener("paste", (e) => {
    const text = e.clipboardData?.getData("text");
    if (!text || !text.trim()) return;
    setTimeout(() => { $("fileName").textContent = ""; show(code.value, "pasted code"); }, 0);
  });

  /* ── buttons and keys ────────────────────────────────────────────── */
  $("run").addEventListener("click", () => {
    const name = seg.dataset.mode === "file" ? ($("fileName").textContent || "pasted code") : "pasted code";
    show(code.value, name);
  });
  $("clear").addEventListener("click", () => {
    code.value = ""; file.value = ""; $("fileName").textContent = ""; setErr("");
    sizePanels();
    (seg.dataset.mode === "code" ? code : drop).focus();
  });
  $("back").addEventListener("click", close);
  $("reload").addEventListener("click", () => show(current, label));
  $("full").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else stage.requestFullscreen?.().catch(() => setErr("Fullscreen was refused by the browser."));
  });

  document.addEventListener("keydown", (e) => {
    if (stage.hidden) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("run").click(); }
      return;
    }
    if (e.key === "Escape" && !document.fullscreenElement) { e.preventDefault(); close(); }
  });

  // size the wrapper before the first paint so nothing jumps
  sizePanels();
  addEventListener("load", sizePanels);
})();
</script>
</body>
</html>
